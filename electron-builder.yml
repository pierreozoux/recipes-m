appId: net.ozoux.recipes-m
productName: recipes-m
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!e2e/*'
  - '!scripts/*'
  - '!test-results/*'
  - '!playwright-report/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{playwright.config.ts,vitest.config.ts,drizzle.config.ts}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  - '**/*.node'
win:
  executableName: recipes-m
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  maintainer: pierre@ozoux.net
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: true
publish:
  provider: github
  # electron-builder defaults to creating/updating a *draft* release, which
  # it refuses to do if a non-draft release for the tag already exists
  # (e.g. created manually) — it silently skips every asset upload instead.
  # We want tag pushes to publish directly, so target a real release.
  releaseType: release
