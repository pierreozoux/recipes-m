name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest and ubuntu-latest are commented out for now — Windows
        # is the only platform we're shipping until mac/linux builds are
        # actually needed. The per-OS publish steps below are already
        # gated by `if: matrix.os == ...`, so re-adding them here is enough
        # to bring those platforms back.
        os: [windows-latest] # , macos-latest, ubuntu-latest

    runs-on: ${{ matrix.os }}
    # electron-builder uploads release assets via the REST API, which needs
    # write access; the default GITHUB_TOKEN permissions for this repo are
    # read-only, so it must be requested explicitly.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # Signing is optional: electron-builder skips it when these secrets
      # are absent, producing an unsigned build instead of failing. GitHub
      # Actions sets unset secrets to an empty string rather than omitting
      # them, and electron-builder's macOS signing path (unlike Windows's)
      # treats an empty CSC_LINK as "a certificate was requested" instead of
      # "no certificate" — so empty vars must be unset before invoking it.
      # - name: Publish (macOS)
      #   if: matrix.os == 'macos-latest'
      #   run: |
      #     [ -z "$CSC_LINK" ] && unset CSC_LINK
      #     [ -z "$CSC_KEY_PASSWORD" ] && unset CSC_KEY_PASSWORD
      #     [ -z "$APPLE_API_KEY" ] && unset APPLE_API_KEY
      #     [ -z "$APPLE_API_KEY_ID" ] && unset APPLE_API_KEY_ID
      #     [ -z "$APPLE_API_ISSUER" ] && unset APPLE_API_ISSUER
      #     pnpm exec electron-builder --mac --publish always
      #   env:
      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #     CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      #     CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      #     APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      #     APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      #     APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Publish (Windows)
        if: matrix.os == 'windows-latest'
        run: pnpm exec electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      # - name: Publish (Linux)
      #   if: matrix.os == 'ubuntu-latest'
      #   run: pnpm exec electron-builder --linux --publish always
      #   env:
      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
